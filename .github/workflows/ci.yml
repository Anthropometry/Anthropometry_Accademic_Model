name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU build of PyTorch: CI only runs the fake-data tests, so the large GPU build isn't needed.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,serve]"
      - run: ruff check .
      # Coverage is measured on every pull request; the run fails below 80% (pyproject.toml).
      - run: pytest --cov --cov-report=term-missing
      # Notebooks must be committed without saved outputs (no data or images in the repo).
      - name: Notebooks have no saved outputs
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          bad = [str(p) for p in pathlib.Path("notebooks").glob("*.ipynb")
                 if any(c.get("outputs") for c in json.loads(p.read_text())["cells"])]
          if bad:
              sys.exit(f"clear outputs before committing: {bad}")
          EOF

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid licence for organisation accounts; the gitleaks
      # program itself is free (MIT). Same tool and check, run directly, version pinned.
      - name: Scan the whole history for secrets (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  # S7c: the API image builds and starts (without the private model, so /v1/health must say "not ready").
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (no model, no baked weights)
        run: docker build --build-arg BAKE_WEIGHTS=0 -t anthro-api .
      - name: Start it and check that it answers
        run: |
          docker run -d --name api -p 8080:8080 -e ANTHRO_API_KEY=ci-only anthro-api
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' http://localhost:8080/v1/health || true)
            [ "$code" = "503" ] && grep -q "not ready" /tmp/h.json && echo "answers: $(cat /tmp/h.json)" && exit 0
            sleep 2
          done
          docker logs api; exit 1
